<h2 mat-dialog-title>Adicione o produto à sua cesta</h2>
<mat-dialog-content>
  <app-card
  [cardData]="cardData"
  [cardOption]="'market'"
  [buttonText]="buttonText"
  [showButton]="true"
  (buttonClick)="handleCardButtonClick('pay')">
</app-card>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="confirmPayment()">Confirmar</button>
</mat-dialog-actions>
